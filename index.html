<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #091413;
      }

      .box {
        width: 150px;
        height: 150px;
        background-color: #7b2525;
        border-radius: 30px;
        margin: 10px;
      }

      .grid {
        display: grid;
        width: 50%;
        height: 50%;
        grid-template-columns: repeat(3, 1fr);
      }

      img {
        aspect-ratio: 1 / 1;
        width: 100%;
      }
    </style>
  </head>

  <body>
    <!-- <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div> -->

    <div class="grid">
      <img
        src="https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/ba51d43803082941b0274b66413b0acc972546dd-616x822.png?accountingTag=VAL&auto=format&fit=fill&q=80&w=352"
        alt=""
      />
      <img
        src="https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/e435c3378b7999a3338b408dbb5da8ba63f91150-616x822.png?accountingTag=VAL&auto=format&fit=fill&q=80&w=352"
        alt=""
      />
      <img
        src="https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/51e62f3c74356a7501d06feba42ac643133257d7-616x822.png?accountingTag=VAL&auto=format&fit=fill&q=80&w=352"
        alt=""
      />
      <img
        src="https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/0f5b668b77499c0051201389d6ac5e7343c9727f-616x822.png?accountingTag=VAL&auto=format&fit=fill&q=80&w=352"
        alt=""
      />
      <img
        src="https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/9f02060077f9d61dbe89555a339e6231006d9b7b-616x822.png?accountingTag=VAL&auto=format&fit=fill&q=80&w=352"
        alt=""
      />
      <img
        src="https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/4a648cdbcbbeef137050deefeaf6a1369c606666-616x822.png?accountingTag=VAL&auto=format&fit=fill&q=80&w=352  "
        alt=""

      <img

      />
      <img
        src="https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/8d88f133f735f6a9077679b1ece754e5624c728e-616x822.png?accountingTag=VAL&auto=format&fit=fill&q=80&w=352"
        alt=""
      />
    </div>

    <script>
      gsap.to(".grid img", {
        scale: 0.9,
        opacity: 0,
        duration: 2,
        stagger: {
          each: 1,
          repeat: -1,
          yoyo: true,
          grid: "auto",
          from: "random"
        },
      });
    </script>
  </body>
</html>
